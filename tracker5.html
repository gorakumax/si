<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Custom Tracker</title>
    <style>
        body { 
            background: #000; 
            color: #4dfa4d; 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            height: 100vh;
            width: 100vw;
        }

        /* 左右のコントロールパネル */
        .side-panel {
            width: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            background: rgba(10, 20, 10, 0.8);
            border-right: 1px solid #1a331a;
            padding: 10px 0;
            z-index: 10;
        }
        .side-panel.right { border-right: none; border-left: 1px solid #1a331a; }

        /* 縦スライダーの設定 */
        .v-slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 40%;
        }
        input[type="range"].vertical {
            writing-mode: bt-lr; /* 縦方向 */
            -webkit-appearance: slider-vertical;
            width: 8px;
            height: 100px;
            accent-color: #4dfa4d;
        }
        .label { font-size: 9px; margin-bottom: 5px; text-align: center; font-weight: bold; }

        /* 中央のメインビューポート */
        #radar-viewport {
            flex-grow: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
        }

        canvas { 
            display: block;
            filter: drop-shadow(0 0 6px rgba(77, 250, 77, 0.8));
        }

        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; color: #4dfa4d; border: 2px solid #4dfa4d; 
            padding: 20px 40px; font-family: inherit; font-weight: bold;
            box-shadow: 0 0 15px rgba(77, 250, 77, 0.5); z-index: 20; cursor: pointer;
        }
    </style>
</head>
<body>

<!-- 左パネル: 入力系 -->
<div class="side-panel">
    <div class="v-slider-container">
        <span class="label">SENS</span>
        <input type="range" id="sensSlider" class="vertical" min="1" max="20" step="0.5" value="8.0">
    </div>
    <div class="v-slider-container">
        <span class="label">THRESH</span>
        <input type="range" id="threshSlider" class="vertical" min="100" max="250" step="5" value="180">
    </div>
</div>

<!-- 中央メイン -->
<div id="radar-viewport">
    <button id="startBtn">INITIALIZE SYSTEM</button>
    <canvas id="mainCanvas"></canvas>
</div>

<!-- 右パネル: 出力系 -->
<div class="side-panel right">
    <div class="v-slider-container">
        <span class="label">PULSE</span>
        <input type="range" id="pulseVol" class="vertical" min="0" max="0.2" step="0.01" value="0.05">
    </div>
    <div class="v-slider-container">
        <span class="label">BEEP</span>
        <input type="range" id="beepVol" class="vertical" min="0" max="0.2" step="0.01" value="0.08">
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const viewport = document.getElementById('radar-viewport');
    
    // スライダー取得
    const sensSlider = document.getElementById('sensSlider');
    const threshSlider = document.getElementById('threshSlider');
    const pulseVol = document.getElementById('pulseVol');
    const beepVol = document.getElementById('beepVol');

    let audioContext, analyser, gainNode, dataArray;
    let blips = [];
    let pulseRadius = 0;

    function resize() {
        canvas.width = viewport.clientWidth;
        canvas.height = viewport.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    async function init() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioContext.createMediaStreamSource(stream);
        
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        
        gainNode = audioContext.createGain();
        gainNode.gain.value = parseFloat(sensSlider.value); 
        
        source.connect(gainNode);
        gainNode.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        startBtn.style.display = 'none';
        draw();
    }

    function draw() {
        // リアルタイム感度更新
        if(gainNode) gainNode.gain.value = parseFloat(sensSlider.value);
        
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height;
        const maxRadius = Math.min(canvas.width * 0.9, canvas.height * 0.95);

        // --- 1. レトロライン描画 ---
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(0, 255, 0, 0.6)";
        ctx.strokeStyle = 'rgba(77, 250, 77, 0.4)';
        ctx.lineWidth = 3;

        for(let r=1; r<=4; r++){
            ctx.beginPath();
            ctx.arc(cx, cy, (maxRadius/4)*r, Math.PI, 0);
            ctx.stroke();
        }
        for(let a=1; a<6; a++){
            let angle = Math.PI + (Math.PI / 6) * a;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angle)*maxRadius, cy + Math.sin(angle)*maxRadius);
            ctx.stroke();
        }
        ctx.shadowBlur = 0;

        // --- 2. 広がるパルス ---
        pulseRadius += (maxRadius / 150); 
        if (pulseRadius > maxRadius) {
            pulseRadius = 0;
            playBeep(300, parseFloat(pulseVol.value), 0.4); 
        }
        
        ctx.strokeStyle = `rgba(77, 255, 77, ${1 - pulseRadius/maxRadius})`;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(cx, cy, pulseRadius, Math.PI, 0);
        ctx.stroke();

        // --- 3. MGS風波形 & ドット ---
        ctx.beginPath();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        const thresh = parseFloat(threshSlider.value);
        
        for (let i = 0; i < dataArray.length; i++) {
            const val = dataArray[i];
            const angle = Math.PI + (i / dataArray.length) * Math.PI;
            
            if(val > 50) {
                const rExp = maxRadius + (val / 255) * 50; 
                ctx.moveTo(cx + Math.cos(angle) * maxRadius, cy + Math.sin(angle) * maxRadius);
                ctx.lineTo(cx + Math.cos(angle) * rExp, cy + Math.sin(angle) * rExp);
            }
            
            if(val > thresh && Math.random() > 0.95) {
                blips.push({angle: angle, dist: maxRadius * (Math.random()*0.8 + 0.1), life: 1.0});
                playBeep(600, parseFloat(beepVol.value), 0.05); 
            }
        }
        ctx.stroke();

        // --- 4. 反応ドット ---
        blips.forEach((b, index) => {
            ctx.fillStyle = `rgba(255, 255, 255, ${b.life})`;
            ctx.shadowBlur = 15; ctx.shadowColor = "#fff";
            const bx = cx + Math.cos(b.angle) * b.dist;
            const by = cy + Math.sin(b.angle) * b.dist;
            ctx.beginPath();
            ctx.arc(bx, by, 6, 0, Math.PI*2);
            ctx.fill();
            b.life -= 0.01;
            if(b.life <= 0) blips.splice(index, 1);
        });

        requestAnimationFrame(draw);
    }

    function playBeep(f, v, d) {
        if(!audioContext || v <= 0) return;
        const o = audioContext.createOscillator();
        const g = audioContext.createGain();
        o.frequency.value = f;
        g.gain.setValueAtTime(v, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + d);
        o.connect(g); g.connect(audioContext.destination);
        o.start(); o.stop(audioContext.currentTime + d);
    }

    startBtn.addEventListener('click', init);
</script>
</body>
</html>
