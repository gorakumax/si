<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Command v5</title>
    <style>
        :root { --main: #4dfa4d; --dim: rgba(77, 250, 77, 0.2); --bg: #000; }
        body { background: var(--bg); color: var(--main); font-family: 'Courier New', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* メインのレーダー表示（左側） */
        #main-view { flex: 1; position: relative; border-right: 1px solid var(--dim); display: flex; flex-direction: column; }
        canvas { flex: 1; width: 100%; height: 100%; }

        /* 右側コントロールパネル */
        #side-panel { width: 300px; padding: 20px; background: rgba(0, 10, 0, 0.9); overflow-y: auto; font-size: 11px; }
        h2 { font-size: 14px; border-bottom: 2px solid var(--main); padding-bottom: 5px; margin-top: 0; }
        
        .control-group { margin-bottom: 20px; border: 1px solid var(--dim); padding: 10px; }
        label { display: block; margin-bottom: 10px; }
        input[type="range"] { width: 100%; accent-color: var(--main); cursor: pointer; }
        
        .data-box { border: 1px solid var(--main); padding: 10px; background: rgba(0, 40, 0, 0.3); margin-bottom: 10px; }
        .data-line { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .val { font-weight: bold; color: #fff; }

        #startBtn { position: absolute; top: 50%; left: 40%; transform: translate(-50%, -50%); 
                    padding: 20px 40px; background: #000; color: var(--main); border: 2px solid var(--main); 
                    cursor: pointer; font-weight: bold; z-index: 100; font-family: inherit; }
    </style>
</head>
<body>

<div id="main-view">
    <canvas id="radarCanvas"></canvas>
    <button id="startBtn">SYSTEM INITIALIZE</button>
</div>

<div id="side-panel">
    <h2>CONTROL_MATRIX</h2>
    
    <div class="control-group">
        <label>GAIN_BOOST (感度増幅)</label>
        <input type="range" id="gainSlider" min="1" max="20" value="5" step="0.5">
        <div class="data-line"><span>LEVEL:</span><span id="gainVal">x5.0</span></div>
    </div>

    <div class="control-group">
        <label>THRESHOLD (探知閾値)</label>
        <input type="range" id="threshSlider" min="0.1" max="10" value="1.8" step="0.1">
        <div class="data-line"><span>LIMIT:</span><span id="threshVal">1.8</span></div>
    </div>

    <h2>REALTIME_TELEMETRY</h2>
    <div class="data-box">
        <div class="data-line"><span>SIGNAL_PEAK:</span><span id="db-val" class="val">--.- dB</span></div>
        <div class="data-line"><span>PRIMARY_FRQ:</span><span id="freq-val" class="val">--- Hz</span></div>
        <div class="data-line"><span>ENVIRONMENT:</span><span id="env-val" class="val">STABLE</span></div>
    </div>

    <div id="log" style="font-size: 9px; opacity: 0.6; height: 100px; overflow: hidden;">
        > BOOTING...<br>
        > SENSOR_READY...<br>
        > WAITING_FOR_INPUT...
    </div>
</div>

<script>
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    
    // スライダー・表示要素
    const gainSld = document.getElementById('gainSlider');
    const threshSld = document.getElementById('threshSlider');
    const gainValDisp = document.getElementById('gainVal');
    const threshValDisp = document.getElementById('threshVal');
    const dbDisp = document.getElementById('db-val');
    const freqDisp = document.getElementById('freq-val');

    let audioCtx, analyser, dataArray, gainNode;
    let lastAvg = 0;

    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    async function init() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioCtx.createMediaStreamSource(stream);
        
        gainNode = audioCtx.createGain();
        gainNode.gain.value = parseFloat(gainSld.value);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        source.connect(gainNode);
        gainNode.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        startBtn.style.display = 'none';
        update();
    }

    function update() {
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        // PCでもスマホでも綺麗に見えるサイズ（短辺基準）
        const baseRadius = Math.min(cx, cy) * 0.8;

        // 1. 半円・円形グリッド（計器風）
        ctx.strokeStyle = 'rgba(77, 250, 77, 0.15)';
        ctx.lineWidth = 1;
        for(let i=1; i<=4; i++) {
            ctx.beginPath();
            ctx.arc(cx, cy, baseRadius * (i/4), 0, Math.PI * 2);
            ctx.stroke();
        }
        // 十字レティクル
        ctx.beginPath();
        ctx.moveTo(cx - baseRadius, cy); ctx.lineTo(cx + baseRadius, cy);
        ctx.moveTo(cx, cy - baseRadius); ctx.lineTo(cx, cy + baseRadius);
        ctx.stroke();

        // 2. 指向性風サラウンド波形 (MGS風)
        let sum = 0;
        let peakIdx = 0;
        let maxV = 0;

        ctx.beginPath();
        ctx.lineWidth = 2;
        for (let i = 0; i < dataArray.length; i++) {
            const v = dataArray[i];
            sum += v;
            if(v > maxV) { maxV = v; peakIdx = i; }

            const angle = (i / dataArray.length) * Math.PI * 2 - Math.PI/2;
            const boost = (v / 255) * (baseRadius * 0.4); 
            
            // 外側へ広がるライン
            const x1 = cx + Math.cos(angle) * baseRadius;
            const y1 = cy + Math.sin(angle) * baseRadius;
            const x2 = cx + Math.cos(angle) * (baseRadius + boost);
            const y2 = cy + Math.sin(angle) * (baseRadius + boost);
            
            ctx.strokeStyle = `rgba(77, 250, 77, ${v/255})`;
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
        }
        ctx.stroke();

        // 3. 数値計算 & スライダー同期
        gainNode.gain.value = parseFloat(gainSld.value);
        gainValDisp.innerText = `x${gainNode.gain.value.toFixed(1)}`;
        threshValDisp.innerText = threshSld.value;

        const avg = sum / dataArray.length;
        const diff = avg - lastAvg;
        dbDisp.innerText = `${(avg * 0.5).toFixed(1)} dB`;
        freqDisp.innerText = `${Math.floor(peakIdx * (audioCtx.sampleRate/analyser.fftSize))} Hz`;
        
        // 探知演出
        if (diff > parseFloat(threshSld.value)) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
            ctx.fill();
            document.getElementById('env-val').innerText = "DETECTED";
            document.getElementById('env-val').style.color = "#fff";
        } else {
            document.getElementById('env-val').innerText = "STABLE";
            document.getElementById('env-val').style.color = var(--main);
        }

        lastAvg = avg;
        requestAnimationFrame(update);
    }

    startBtn.addEventListener('click', () => init());
</script>
</body>
</html>
