<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surround Sonar</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Helvetica Neue', Helvetica, sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        #sonar-container {
            position: relative; width: 95vw; height: 95vw; max-width: 450px; max-height: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%; overflow: hidden; background: #000;
        }
        
        /* 十字線（レティクル）: 非常に薄く表示 */
        #sonar-container::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.05); transform: translateX(-50%); }
        #sonar-container::after { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.05); transform: translateY(-50%); }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #info { margin-top: 15px; font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 1px; text-align: center; }
        
        button { background: transparent; color: #fff; border: 1px solid #fff; padding: 15px 35px; cursor: pointer; font-size: 1.1em; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="sonar-container">
    <canvas id="sonarCanvas"></canvas>
</div>

<div id="info">
    <div>MODE: AMBIENT_SURROUND_SCAN</div>
</div>

<p><button id="startBtn">ACTIVATE</button></p>

<script>
    const canvas = document.getElementById('sonarCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');

    let audioContext, analyser, dataArray;
    let particles = [];

    // キャンバスサイズ設定
    function resize() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    window.addEventListener('resize', resize);
    resize();

    async function init() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioContext.createMediaStreamSource(stream);
            
            const gainNode = audioContext.createGain();
            gainNode.gain.value = 5.0; // 感度ブースト

            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.5; // 波形の動きを少し滑らかに

            source.connect(gainNode);
            gainNode.connect(analyser);
            
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            startBtn.style.display = 'none';
            draw();
            
            // 定期的な環境音（小さく）
            setInterval(() => playPing(300, 0.02), 2500);
        } catch (err) { alert("マイクの許可が必要です。"); }
    }

    function draw() {
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const baseRadius = canvas.width * 0.35; // インジケーターの基本円の大きさ

        // --- 【新機能】MGS V風サラウンドインジケーターの描画 ---
        ctx.beginPath();
        ctx.lineWidth = 1.5; // 波形の線の太さ
        
        const numBars = dataArray.length;
        for (let i = 0; i < numBars; i++) {
            const freqValue = dataArray[i]; // 0 〜 255
            
            // 音の高さ(周波数)を角度に割り当てる
            const angle = (i / numBars) * Math.PI * 2 - Math.PI / 2;
            
            // 音の大きさに合わせて、基本円から「外側へ広がる量」
            // MGS Vのように、大きな音ほど大きく膨らむように
            const expandAmount = (freqValue / 255) * baseRadius * 0.8; 
            
            // 波形の終点を計算
            const rx = cx + Math.cos(angle) * (baseRadius + expandAmount);
            const ry = cy + Math.sin(angle) * (baseRadius + expandAmount);

            // MGS Vのインジケーターは、音量が大きい方向が白く、明るく描画される
            // ここでは音の大きさを透明度(alpha)に割り当てる
            ctx.strokeStyle = `rgba(255, 255, 255, ${freqValue / 255})`; 

            // 基本円の少し内側から、外側の膨らんだ位置まで線を引く
            const rxBase = cx + Math.cos(angle) * (baseRadius - 5);
            const ryBase = cy + Math.sin(angle) * (baseRadius - 5);

            ctx.moveTo(rxBase, ryBase);
            ctx.lineTo(rx, ry);
        }
        ctx.stroke();

        // 中央に薄い基本円を描画（MGS Vの待機状態のUI）
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.stroke();

        requestAnimationFrame(draw);
    }

    function playPing(f, v) {
        if(!audioContext) return;
        const o = audioContext.createOscillator();
        const g = audioContext.createGain();
        o.frequency.value = f;
        g.gain.setValueAtTime(0, audioContext.currentTime);
        g.gain.linearRampToValueAtTime(v, audioContext.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2);
        o.connect(g); g.connect(audioContext.destination);
        o.start(); o.stop(audioContext.currentTime + 0.2);
    }

    startBtn.addEventListener('click', init);
</script>
</body>
</html>
